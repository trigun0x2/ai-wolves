# fly.toml app configuration file generated for ai-wolves on 2026-06-13T08:46:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-wolves'
primary_region = 'sjc'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '3000'
  TRANSCRIPTS_DIR = '/data/transcripts'

[[mounts]]
  source = 'wolves_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
